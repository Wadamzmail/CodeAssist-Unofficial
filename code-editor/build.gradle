plugins {
    id 'com.android.library'
}
apply plugin: 'com.diffplug.spotless'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
	namespace = "io.github.rosemoe.sora2"
	
	spotless {
		java {
			target "**/*.java"
			googleJavaFormat()
			}
		}
	
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true	    
    }
}

configurations.implementation {
    exclude group: "xerces", module: "xercesImpl"
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation project(path: ':completion-api')
    implementation project(path: ':java-completion')
    implementation project(path: ':common')
    
    implementation("org.checkerframework:checker-qual:3.50.0")
 	api ('io.github.rosemoe:editor:0.24.4')
    api ('io.github.rosemoe:language-textmate:0.24.4') 
}