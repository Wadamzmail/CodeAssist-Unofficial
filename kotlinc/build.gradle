plugins {
    id 'com.android.library'
}
apply plugin: 'kotlin-android'
apply plugin: 'com.diffplug.spotless'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
	namespace = "org.jetbrains.kotlin"
	
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations.all {
    resolutionStrategy {
        force("org.jetbrains:annotations:26.0.2")
    }
}

dependencies {
    implementation 'com.github.marschall:zipfilesystem-standalone:1.0.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation project(path: ':jaxp:jaxp-internal')
    implementation project(path: ':jaxp:xml')

    runtimeOnly ('org.jetbrains.kotlin:kotlin-reflect:2.2.21')

  //  api 'org.jetbrains.trove4j:trove4j:20160824'
   // api files('libs/kotlin-compiler-embeddable-1.7.20-RC.jar')
  //  api files('libs/kotlin-compiler-2.0.0.jar')
	api 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.21'
	api files('libs/javax.jar')
    compileOnly files('libs/the-unsafe.jar')
    compileOnly project(path: ':android-stubs')
    implementation project(':javac')
   
    compileOnly 'org.jetbrains:annotations:26.0.2'
    api("org.lsposed.hiddenapibypass:hiddenapibypass:6.1")
    api("org.jetbrains.intellij.deps:trove4j:1.0.20200330")
    implementation files('libs/jps-model-impl-253.28294.357.jar') 
   
   //XML
   api("org.jdom:jdom:2.0.2")
   implementation("org.codehaus.woodstox:stax2-api:4.2.2")
   implementation files('libs/util-jdom-253.28294.357.jar')
   implementation files('libs/util-xml-dom-253.28294.357.jar')
   
   //intellij util
  // implementation files('libs/util-253.28294.357.jar')

}

repositories {
    mavenCentral()
    maven { url = 'https://www.jetbrains.com/intellij-repository/releases/'} 
}

spotless {
		java {
			target "**/*.java"
			googleJavaFormat()
			}
}